name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        # Built before lint so a style regression never costs you an installable
        # APK. The secret is optional: without it the build still succeeds and
        # the app asks for a TMDB key on first launch.
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BaCine-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaCine-debug-apk
          path: dist/BaCine-debug.apk
          if-no-files-found: error

      - name: Package Kodi bridge add-on
        # Kodi expects the add-on folder at the root of the zip, and the
        # version in the file name is what users tell releases apart by.
        run: |
          version=$(sed -n 's/.*<addon [^>]*version="\([^"]*\)".*/\1/p' kodi/plugin.video.bacine/addon.xml)
          (cd kodi && zip -r "../dist/plugin.video.bacine-$version.zip" plugin.video.bacine -x '*/__pycache__/*')

      - name: Upload Kodi add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin.video.bacine
          path: dist/plugin.video.bacine-*.zip
          if-no-files-found: error

      - name: Lint
        # No --stacktrace: Gradle interleaves the exception dump with lint's own
        # output, which buries the findings we actually need to read.
        run: ./gradlew lintDebug

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore

      - name: Publish release
        # Tagging is what produces a URL the projector can download directly.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BaCine-debug.apk
            dist/plugin.video.bacine-*.zip
          generate_release_notes: true
